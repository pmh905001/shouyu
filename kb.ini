[basic]
;specify the path of excel file, default is kb.xlsx in the same directory as the ini file.
;you also can set different path. For example:
excel_path=C:\Users\u1079313\daily-task\daily-task-sanofi.xlsx
;max number of backup files to keep before saving, default is 100.
max_backups=100
;How long (minutes) a queued save can sit unsynced (usually because Excel/WPS
;has the file open) before a toast tells you it's still waiting. The save
;itself is never lost - it keeps retrying in the background regardless.
stuck_alert_minutes=30
;Sheet names (besides the daily YYYY-MM-DD tabs) that should always stay
;grouped together at the end of the tab bar, right next to today's date
;tab, in this exact order - instead of drifting further behind it as new
;daily tabs pile up. Comma-separated, use your exact tab names. Example:
;pinned_sheets=accounts,work,todo list,backlog-work,backlog-life
pinned_sheets=accounts,work,todo list,backlog-work,backlog-life

[shortcuts]
;Hot key to save content of clipboard to excel file
;Press 1 time → column B, press 2 times quickly → column A
save_clipboard=ctrl+shift+enter
;Open excel by MS Excel / WPS
open_excel=ctrl+\
;Close excel
close_excel=ctrl+q
;Show last record and position changed
show_status=alt+/
;Show the today's task panel (PySide6). Esc to close.
show_todo=ctrl+alt+`
;Re-open the morning ritual (habit + plan) dialog. Bypasses the "shown today" check.
show_habits=ctrl+alt+h
;Start / pause the pomodoro timer. If a cycle is running but the floating
;window is hidden, this hotkey summons the window back instead of pausing.
toggle_pomodoro=ctrl+alt+p
;Show / hide the floating pomodoro window. Press once to summon it back
;after you've hidden it; press again to hide it.
toggle_pomodoro_window=ctrl+alt+t
;Open the "restore from backup" dialog (lets you roll back to any of the recent
;auto-backups in case the main Excel got corrupted or you made a bad edit).
restore_backup=ctrl+alt+r
;text in one or cross multiple cells, default is multiple cell mode.
one_or_multiple_cells_mode=ctrl+F9
;Drag-select a screen region, OCR the text in it, copy that text to the
;clipboard, then save it just like a normal clipboard-text save. Esc cancels.
ocr_capture=ctrl+alt+o

[habits]
;Each line is a habit reminder shown on startup. Add habit_1, habit_2, ...
;Recommended: keep the list under 5 items so they actually stick.
habit_1=先用 5 分钟规划今日 3 件最重要的事，写不下来一定会被遗忘。
habit_2=任务未完成前，手机放进抽屉——大脑无法同时停留在两个 attention 上。
habit_3=从最简单的子任务开始，5 分钟内进入心流；难的留到第二个番茄。
habit_4=交社保

[pomodoro]
;Set enabled=false to fully disable the pomodoro timer.
enabled=true
work_minutes=25
short_break_minutes=5
long_break_minutes=20
cycles_before_long_break=4
;Beep on transitions
notify_sound=true
;Stay silent while the workstation is locked (you've stepped away / left for
;the day). Recommended on: a locked screen means nobody's there to hear it,
;and it avoids beeping on a shared/office machine after you lock and leave.
;This also stops the idle "走神" alarm from escalating while locked — a
;deliberate lock isn't drifting. Set to false to keep beeping even when locked.
silence_when_locked=true
;How to announce the START of a break so you don't work straight through it:
;  center = pop a centered "该休息了" card and bring the timer window to the
;           front (calm, hard to miss, one click to skip / start resting)
;  off    = just quietly show the small floating window in the corner (old)
break_reminder=center
;Deep mode (toggled via the small "深度" button on the timer window):
;longer focused work blocks with proportionally longer breaks. Use for
;tasks that need real flow (writing, complex code) where 25min is too short.
deep_work_minutes=50
deep_short_break_minutes=10
deep_long_break_minutes=30
;Idle detection (only while a working pomodoro is running; pause / stop /
;break phases never trigger it). Two escalating levels:
;  Level 1 (soft, silent): after idle_warning_seconds of no mouse/keyboard
;    activity, the 🍅 / phase label blinks red. Clears by itself once you
;    move again. Set idle_warning_seconds=0 to disable entirely.
;  Level 2 (hard alarm): after idle_alarm_seconds, it beeps repeatedly,
;    forces the (hidden) window back to the front, and requires an explicit
;    "我回来了" click to dismiss — each dismiss is counted as a "走神".
;    Set idle_alarm_seconds=0 to disable escalation.
;Tip: keep idle_warning_seconds around 45-90s so it doesn't cry wolf; too
;small (e.g. 10s) fires during normal thinking/reading and you go numb.
idle_warning_seconds=180
idle_alarm_seconds=300
;If you hit the hard alarm this many times within one working phase, we
;assume you genuinely need rest and force a short break. Set 0 to disable.
idle_drifts_before_break=3
;Environment mode decides HOW you get nudged:
;  在家 (home)  -> soft low-volume sound + the floating window.
;  在单位 (office/quiet) -> completely silent + a full-screen popup you must
;    dismiss with the "我回来了" button (so it won't disturb colleagues).
;The floating window has a 自动/在家/在单位 button. In 自动 mode the profile
;follows the schedule below; a manual pick wins but only for the current day.
;Quiet window: on these weekdays, between quiet_start and quiet_end, 自动
;mode uses the office/quiet profile; outside it, the home profile.
;quiet_days accepts mon..sun, 0-6 (Mon=0), or weekday/weekend/all.
quiet_days=mon,tue,wed,thu,fri
quiet_start=09:00
quiet_end=18:00
;Default mode on launch (before you toggle the 深度/经典 button):
;deep = 90/15, classic = 25/5. Default: deep.
default_mode=deep
;Morning planning session: the very first pomodoro of each day is a short
;"plan today's tasks" block instead of a normal work block, followed by a
;short break. Set planning_enabled=false to disable.
planning_enabled=true
planning_session_minutes=10
planning_break_minutes=5
;Lunch window: no working/planning phase is allowed to start during this
;time range — it becomes a "lunch break" that lasts until the window ends,
;then work resumes automatically. Format HH:MM. Set lunch_enabled=false to
;disable.
lunch_enabled=true
lunch_start=11:30
lunch_end=13:00

[planning]
;After you finish typing a brand-new task name, automatically pop up the
;duration picker so you commit to a time budget. Set to false to disable.
auto_prompt_duration=true
;Total estimated minutes per day above which the overload warning shows.
;Default 360 (6h) — about as much real focused work as a day allows.
overload_threshold_minutes=360
